<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 600px;
        }

        .welcome-container h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 16px;
        }

        .welcome-container h1 .wave {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        .welcome-container p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.8;
        }

        .welcome-container .subtitle {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #999;
        }

        .welcome-container .status {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 20px;
            background: #4ade80;
            color: #fff;
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>欢迎 <span class="wave">👋</span></h1>
        <p>🎉 服务已成功启动，一切运行正常！</p>
        <p class="subtitle">Spring Boot Application · changtest</p>
        <span class="status">● 运行中</span>
    </div>
</body>
</html>
