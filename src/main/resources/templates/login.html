<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 380px;
            max-width: 90%;
        }
        .container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #5a6fd6;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .success {
            background: #d1fae5;
            color: #059669;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .link {
            text-align: center;
            margin-top: 18px;
            color: #888;
            font-size: 0.9rem;
        }
        .link a {
            color: #667eea;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>登录</h1>

        <div class="success" th:if="${param.registered}">
            注册成功，请登录
        </div>
        <div class="success" th:if="${param.logout}">
            已安全退出
        </div>
        <div class="error" th:if="${loginError != null}" th:text="${loginError}">
            用户名或密码错误
        </div>

        <form method="post" action="/login">
            <input type="hidden" name="_csrf" th:value="${csrfToken}" />
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required="required" autocomplete="username"
                       th:value="${username}" />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required="required" autocomplete="current-password" />
            </div>
            <button type="submit" class="btn">登录</button>
        </form>

        <p class="link">还没有账号？<a href="/register">立即注册</a></p>
    </div>
</body>
</html>
